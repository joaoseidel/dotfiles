# Kitty Configuration

# ===== Core Settings =====
kitty_mod cmd

# Enable splits and stack layouts (for zoom functionality)
enabled_layouts splits,stack

# ===== Font Configuration =====
# Use a Nerd Font for icon support
font_family      Cascadia Code Nerd Font
font_size        13.0

# Per-character font mapping for special symbols
symbol_map U+017F-U+1869F Menlo

# ===== Window Management =====

# Create new window (horizontal split)
map kitty_mod+shift+d launch --location=hsplit --cwd=current

# Create new window (vertical split)
map kitty_mod+d launch --location=vsplit --cwd=current

# Close window
map kitty_mod+w close_window

# Zoom window (toggle between layouts)
map kitty_mod+z toggle_layout stack

# ===== Window Navigation =====
# Using backtick sequences to avoid conflicts
# Requires vim-kitty-navigator plugin

# Navigate between windows
map ctrl+` kitten pass_keys.py neighboring_window
map ctrl+`>h kitten pass_keys.py left
map ctrl+`>j kitten pass_keys.py bottom
map ctrl+`>k kitten pass_keys.py top
map ctrl+`>l kitten pass_keys.py right

# ===== Window Resizing =====
# Resize windows with directional keys
map kitty_mod+shift+h resize_window narrower
map kitty_mod+shift+l resize_window wider
map kitty_mod+shift+k resize_window taller
map kitty_mod+shift+j resize_window shorter

# ===== Tab Management =====

# New tab
map kitty_mod+t new_tab_with_cwd

# Close tab
map kitty_mod+q close_tab

# Navigate tabs
map kitty_mod+shift+] next_tab
map kitty_mod+shift+[ previous_tab

# Move tabs
map kitty_mod+shift+. move_tab_forward
map kitty_mod+shift+, move_tab_backward

# Tab title template (shows layout/zoom status)
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{layout_name[:2].upper()}{title}"

# ===== Broadcasting Input =====
# Broadcast to all windows in current tab
map kitty_mod+shift+s launch --allow-remote-control kitty +kitten broadcast

# ===== Copy Mode / Scrollback =====
# Use vim as pager for scrollback
scrollback_pager vim -c 'setlocal nomodifiable | setlocal nomodified | map q :qa!<CR>' -

# ===== Appearance =====
# Remove title bar (macOS)
hide_window_decorations titlebar-only

# Cursor
cursor_shape block
cursor_blink_interval 0

# Window padding
window_padding_width 4

# Tab bar style
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# ===== Misc Settings =====
# Copy to clipboard on selection
copy_on_select yes

# Confirm before closing
confirm_os_window_close 0

# Shell integration
shell_integration enabled

# ===== Color Scheme =====
# You can customize this or use a theme
background_opacity 0.95

# Example: Tokyo Night colors (uncomment if desired)
# foreground #c0caf5
# background #1a1b26
# selection_background #33467C
# selection_foreground #c0caf5
# url_color #73daca
# cursor #c0caf5
